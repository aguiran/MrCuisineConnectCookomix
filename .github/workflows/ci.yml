# Tests et compilation à chaque pull request vers main (et à la demande).
# Une PR ne se fusionne que si ce workflow est vert (protection de la branche main).
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Tests (core) and debug build
        run: ./gradlew --no-daemon :core:test :app:assembleDebug

      - name: Tests (install scripts)
        run: |
          bash tools/setup/tests/root-permissions.sh
          bash tools/setup/tests/root-boot-grant.sh

      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: core/build/reports/tests/test/
